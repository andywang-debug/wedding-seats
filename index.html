<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎参加我们的答谢宴 | 座位查询</title>
    <style>
        :root {
            --forest-deep: #1A3123;
            --forest-dark: #274734;
            --sage-green: #53705C;
            --sage-light: #EBF1ED;
            --gold-accent: #B89758;
            --gold-light: #DFCA9B;
            --bg-cream: #FAF9F5;
            --text-main: #26302B;
            --text-muted: #6C7D73;
            --border-color: #D5DFD8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-cream);
            background-image: 
                radial-gradient(circle at 10% 15%, rgba(83, 112, 92, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 90% 85%, rgba(184, 151, 88, 0.08) 0%, transparent 45%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* 森林角落植物点缀 (SVG) */
        .corner-leaf {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            opacity: 0.2;
            width: 120px;
            height: 120px;
        }
        .corner-leaf-top-left { top: -10px; left: -10px; }
        .corner-leaf-top-right { top: -10px; right: -10px; transform: scaleX(-1); }
        .corner-leaf-bottom-left { bottom: -10px; left: -10px; transform: scaleY(-1); }
        .corner-leaf-bottom-right { bottom: -10px; right: -10px; transform: scale(-1, -1); }

        /* 主体卡片容器 */
        .main-card {
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 36px 26px 30px;
            box-shadow: 0 10px 30px rgba(26, 49, 35, 0.06);
            text-align: center;
            position: relative;
            z-index: 1;
        }

        /* 顶部标题区 */
        .en-title {
            font-size: 11px;
            color: var(--sage-green);
            letter-spacing: 3.5px;
            text-transform: uppercase;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .header-title-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        h1 {
            color: var(--forest-deep);
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 2px;
        }

        .branch-icon {
            width: 28px;
            height: 14px;
            fill: var(--gold-accent);
            opacity: 0.85;
        }
        .branch-right { transform: scaleX(-1); }

        .subtitle {
            font-size: 13px;
            color: var(--gold-accent);
            letter-spacing: 3px;
            font-weight: 500;
        }

        .leaf-divider {
            margin: 16px auto 26px;
            color: var(--sage-green);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            opacity: 0.55;
            font-size: 14px;
        }

        .leaf-divider::before, .leaf-divider::after {
            content: "";
            width: 45px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-accent), transparent);
        }

        /* 搜索输入与按钮 */
        .search-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 15px 18px;
            font-size: 16px;
            border: 1.5px solid var(--sage-green);
            border-radius: 30px;
            outline: none;
            background: #FFFFFF;
            color: var(--text-main);
            text-align: center;
            letter-spacing: 1.5px;
            box-shadow: 0 4px 14px rgba(39, 71, 52, 0.05);
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: var(--gold-accent);
            box-shadow: 0 4px 16px rgba(184, 151, 88, 0.25);
        }

        .search-btn {
            margin-top: 14px;
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, var(--forest-dark), var(--forest-deep));
            color: #FFFFFF;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 3px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(26, 49, 35, 0.2);
            transition: all 0.25s ease;
        }

        .search-btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        /* 查询结果展示区 (默认隐藏) */
        .result-container {
            display: none;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px dashed var(--border-color);
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .guest-greeting {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .guest-name-tag {
            color: var(--forest-deep);
            font-weight: 600;
            font-size: 16px;
        }

        .seat-highlight-box {
            background: linear-gradient(180deg, #FFFFFF, var(--sage-mist, #F7FAF8));
            border: 1.5px solid var(--gold-accent);
            border-radius: 16px;
            padding: 22px 16px;
            margin-bottom: 16px;
            box-shadow: 0 6px 18px rgba(184, 151, 88, 0.12);
        }

        .seat-badge {
            font-size: 12px;
            letter-spacing: 2px;
            color: var(--gold-accent);
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .table-display {
            font-size: 34px;
            font-weight: 700;
            color: var(--forest-deep);
            letter-spacing: 2px;
            margin: 4px 0;
        }

        .table-desc {
            font-size: 13px;
            color: var(--sage-green);
            font-weight: 500;
            margin-top: 4px;
        }

        .seat-location-hint {
            font-size: 12px;
            color: var(--text-muted);
            background: #F4F7F4;
            padding: 10px 14px;
            border-radius: 8px;
            line-height: 1.6;
        }

        /* 错误未查到状态 */
        .not-found-box {
            display: none;
            margin-top: 20px;
            padding: 16px;
            background: #FDF7F5;
            border: 1px solid #EAD4CC;
            border-radius: 12px;
            font-size: 13px;
            color: #9E5241;
            line-height: 1.6;
            animation: fadeIn 0.3s ease forwards;
        }

        /* 底部落款 */
        .footer-note {
            text-align: center;
            font-size: 11px;
            color: var(--sage-green);
            margin-top: 24px;
            line-height: 1.8;
            opacity: 0.85;
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>

    <!-- 四角植物藤蔓装饰 -->
    <svg class="corner-leaf corner-leaf-top-left" viewBox="0 0 100 100">
        <path d="M0,0 Q30,60 100,70 Q40,30 0,0 M15,15 Q45,25 60,10 M25,35 Q60,55 75,30 M10,40 Q30,70 10,95" fill="none" stroke="#274734" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M45,20 Q60,15 65,5 Q55,15 45,20 M55,42 Q75,50 82,38 Q68,46 55,42 M22,65 Q32,80 18,90 Q22,76 22,65" fill="#53705C"/>
    </svg>
    <svg class="corner-leaf corner-leaf-top-right" viewBox="0 0 100 100">
        <path d="M0,0 Q30,60 100,70 Q40,30 0,0 M15,15 Q45,25 60,10 M25,35 Q60,55 75,30 M10,40 Q30,70 10,95" fill="none" stroke="#274734" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M45,20 Q60,15 65,5 Q55,15 45,20 M55,42 Q75,50 82,38 Q68,46 55,42 M22,65 Q32,80 18,90 Q22,76 22,65" fill="#53705C"/>
    </svg>
    <svg class="corner-leaf corner-leaf-bottom-left" viewBox="0 0 100 100">
        <path d="M0,0 Q30,60 100,70 Q40,30 0,0 M15,15 Q45,25 60,10 M25,35 Q60,55 75,30 M10,40 Q30,70 10,95" fill="none" stroke="#274734" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M45,20 Q60,15 65,5 Q55,15 45,20 M55,42 Q75,50 82,38 Q68,46 55,42 M22,65 Q32,80 18,90 Q22,76 22,65" fill="#53705C"/>
    </svg>
    <svg class="corner-leaf corner-leaf-bottom-right" viewBox="0 0 100 100">
        <path d="M0,0 Q30,60 100,70 Q40,30 0,0 M15,15 Q45,25 60,10 M25,35 Q60,55 75,30 M10,40 Q30,70 10,95" fill="none" stroke="#274734" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M45,20 Q60,15 65,5 Q55,15 45,20 M55,42 Q75,50 82,38 Q68,46 55,42 M22,65 Q32,80 18,90 Q22,76 22,65" fill="#53705C"/>
    </svg>

    <!-- 查询卡片主体 -->
    <div class="main-card">
        <div class="en-title">WELCOME TO OUR CELEBRATION DINNER</div>
        <div class="header-title-box">
            <svg class="branch-icon" viewBox="0 0 36 18">
                <path d="M0 12 C10 12 20 6 36 2 C28 6 18 14 0 12 Z"/>
                <circle cx="8" cy="8" r="2.5"/>
                <circle cx="18" cy="5" r="2.2"/>
                <circle cx="28" cy="3" r="1.8"/>
            </svg>
            <h1>欢迎参加我们的答谢宴</h1>
            <svg class="branch-icon branch-right" viewBox="0 0 36 18">
                <path d="M0 12 C10 12 20 6 36 2 C28 6 18 14 0 12 Z"/>
                <circle cx="8" cy="8" r="2.5"/>
                <circle cx="18" cy="5" r="2.2"/>
                <circle cx="28" cy="3" r="1.8"/>
            </svg>
        </div>
        <div class="subtitle">宴会座席指引</div>
        <div class="leaf-divider">🌿</div>

        <!-- 搜索输入框 -->
        <div class="search-wrapper">
            <input type="text" id="guestInput" class="search-input" placeholder="请输入您的姓名查找座位" autocomplete="off">
            <button class="search-btn" onclick="querySeat()">查询我的座位</button>
        </div>

        <!-- 查询成功展示区 -->
        <div id="resultBox" class="result-container">
            <div class="guest-greeting">尊敬的 <span id="resGuestName" class="guest-name-tag"></span> 贵宾：</div>
            <div class="seat-highlight-box">
                <div class="seat-badge">YOUR SEAT</div>
                <div class="table-display">您在 <span id="resTableNum" style="color:var(--gold-accent);">--</span> 号桌</div>
                <div id="resTableName" class="table-desc"></div>
            </div>
            <div id="resLocationHint" class="seat-location-hint">
                📍 宴会厅内已设置相应桌号立牌，入席若有疑问可联系迎宾人员。
            </div>
        </div>

        <!-- 未查到提示 -->
        <div id="notFoundBox" class="not-found-box">
            抱歉，未查询到该姓名的座席信息。<br>
            请确认姓名输入是否正确，或联系现场迎宾人员协助入席。
        </div>
    </div>

    <div class="footer-note">
        🌱 感谢您的莅临与见证 · 祝您度过愉快的夜晚
    </div>

    <script>
        // 20桌数据名单（每桌10人，随时替换为你真实的名单）
        const seatingData = [
            { table: "01", name: "主桌 (左侧)", location: "靠主舞台左侧首排", guests: ["新郎父母", "新郎祖父母", "至亲叔舅", "至亲姑姨", "至亲长辈A", "至亲长辈B", "至亲长辈C", "至亲长辈D", "伴郎代表", "主宾代表A"] },
            { table: "02", name: "主桌 (右侧)", location: "靠主舞台右侧首排", guests: ["新娘父母", "新娘祖父母", "至亲舅舅", "至亲阿姨", "至亲长辈E", "至亲长辈F", "至亲长辈G", "至亲长辈H", "伴娘代表", "主宾代表B"] },
            { table: "03", name: "长辈亲友桌 01", location: "靠近仪式T台左侧第2排", guests: ["王大爷", "李大妈", "王伯伯", "张婶婶", "赵叔叔", "孙阿姨", "周伯父", "吴伯母", "郑爷爷", "钱奶奶"] },
            { table: "04", name: "长辈亲友桌 02", location: "靠近仪式T台右侧第2排", guests: ["陈大伯", "林阿姨", "黄舅舅", "刘舅妈", "何叔叔", "许姑姑", "韩伯伯", "邓阿姨", "冯爷爷", "宋奶奶"] },
            { table: "05", name: "至亲堂表桌 01", location: "左侧第3排区域", guests: ["堂哥A", "堂嫂A", "堂弟A", "堂妹A", "表哥A", "表嫂A", "表弟A", "表妹A", "侄子A", "侄女A"] },
            { table: "06", name: "至亲堂表桌 02", location: "右侧第3排区域", guests: ["表哥B", "表嫂B", "表姐B", "表妹B", "堂弟B", "堂妹B", "舅表兄", "舅表妹", "外甥A", "外甥女A"] },
            { table: "07", name: "亲友来宾桌 01", location: "左侧中区", guests: ["张建国", "李秀英", "王志强", "刘海燕", "陈勇", "杨丽", "赵明", "孙敏", "周涛", "吴静"] },
            { table: "08", name: "亲友来宾桌 02", location: "右侧中区", guests: ["黄国强", "徐红", "朱文", "胡秀兰", "高飞", "林芳", "马伟", "何玉英", "罗斌", "郭萍"] },
            { table: "09", name: "发小死党桌", location: "靠近甜品台旁", guests: ["李雷", "韩梅梅", "刘星", "夏雨", "林冲", "武松", "鲁智深", "杨志", "花荣", "柴进"] },
            { table: "10", name: "闺蜜挚友桌", location: "靠近拍照打卡区", guests: ["沈佳宜", "胡一菲", "陈美嘉", "唐悠悠", "林宛瑜", "顾里", "林萧", "南湘", "唐宛如", "甄嬛"] },
            { table: "11", name: "大学同窗桌 01", location: "左侧后区", guests: ["张伟", "李强", "王磊", "刘洋", "陈杰", "杨洋", "赵杰", "孙强", "周杰", "吴磊"] },
            { table: "12", name: "大学同窗桌 02", location: "右侧后区", guests: ["王芳", "李娜", "张敏", "刘艳", "陈晨", "杨静", "赵婷", "孙莉", "周丽", "吴英"] },
            { table: "13", name: "校友青年桌 01", location: "左后侧靠窗", guests: ["Alex", "Bob", "Charlie", "David", "Eric", "Frank", "George", "Henry", "Ian", "Jack"] },
            { table: "14", name: "校友青年桌 02", location: "右后侧靠窗", guests: ["Alice", "Bella", "Chloe", "Daisy", "Emily", "Fiona", "Grace", "Helen", "Ivy", "Judy"] },
            { table: "15", name: "同侪伙伴桌 01", location: "左侧后排", guests: ["同事A", "同事B", "同事C", "同事D", "同事E", "同事F", "同事G", "同事H", "同事I", "同事J"] },
            { table: "16", name: "同侪伙伴桌 02", location: "右侧后排", guests: ["同事K", "同事L", "同事M", "同事N", "同事O", "同事P", "同事Q", "同事R", "同事S", "同事T"] },
            { table: "17", name: "挚友嘉宾桌 01", location: "临近主入口左侧", guests: ["好友A", "好友B", "好友C", "好友D", "好友E", "好友F", "好友G", "好友H", "好友I", "好友J"] },
            { table: "18", name: "挚友嘉宾桌 02", location: "临近主入口右侧", guests: ["好友K", "好友L", "好友M", "好友N", "好友O", "好友P", "好友Q", "好友R", "好友S", "好友T"] },
            { table: "19", name: "预留机动桌", location: "大厅右后备用席", guests: ["机动贵宾1", "机动贵宾2", "机动贵宾3", "机动贵宾4", "机动贵宾5", "机动贵宾6", "机动贵宾7", "机动贵宾8", "机动贵宾9", "机动贵宾10"] },
            { table: "20", name: "工作服务团队", location: "音控台后侧", guests: ["主摄影师", "副摄影师", "摄像师A", "摄像师B", "跟妆师", "司仪", "现场督导", "音响师", "灯光师", "宴会统筹"] }
        ];

        function querySeat() {
            const inputVal = document.getElementById('guestInput').value.trim();
            const resultBox = document.getElementById('resultBox');
            const notFoundBox = document.getElementById('notFoundBox');

            if (!inputVal) {
                alert("请输入您的姓名");
                return;
            }

            let found = null;

            // 匹配宾客姓名
            for (let t of seatingData) {
                for (let g of t.guests) {
                    if (g.toLowerCase() === inputVal.toLowerCase() || (inputVal.length >= 2 && g.includes(inputVal))) {
                        found = {
                            matchedName: g,
                            table: t.table,
                            name: t.name,
                            location: t.location
                        };
                        break;
                    }
                }
                if (found) break;
            }

            if (found) {
                document.getElementById('resGuestName').textContent = found.matchedName;
                document.getElementById('resTableNum').textContent = found.table;
                document.getElementById('resTableName').textContent = found.name;
                document.getElementById('resLocationHint').innerHTML = `📍 方位指引：<strong>${found.location}</strong>。宴会厅已设桌号立牌，入席若有疑问可联系迎宾人员。`;
                resultBox.style.display = 'block';
                notFoundBox.style.display = 'none';
            } else {
                resultBox.style.display = 'none';
                notFoundBox.style.display = 'block';
            }
        }

        // 支持敲回车键查询
        document.getElementById('guestInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                querySeat();
            }
        });
    </script>
</body>
</html>
