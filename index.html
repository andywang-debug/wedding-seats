<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎参加我们的答谢宴 | 座位查询</title>
    <style>
        :root {
            --forest-deep: #1A3123;
            --forest-dark: #274734;
            --sage-green: #53705C;
            --sage-light: #EBF1ED;
            --gold-accent: #B89758;
            --gold-light: #DFCA9B;
            --bg-cream: #FAF9F5;
            --text-main: #26302B;
            --text-muted: #6C7D73;
            --border-color: #D5DFD8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-cream);
            background-image: 
                radial-gradient(circle at 10% 15%, rgba(83, 112, 92, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 90% 85%, rgba(184, 151, 88, 0.08) 0%, transparent 45%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 24px 16px 60px;
            position: relative;
        }

        /* 森林角落植物点缀 */
        .corner-leaf {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            opacity: 0.2;
            width: 110px;
            height: 110px;
        }
        .corner-leaf-top-left { top: -10px; left: -10px; }
        .corner-leaf-top-right { top: -10px; right: -10px; transform: scaleX(-1); }
        .corner-leaf-bottom-left { bottom: -10px; left: -10px; transform: scaleY(-1); }
        .corner-leaf-bottom-right { bottom: -10px; right: -10px; transform: scale(-1, -1); }

        .main-card {
            width: 100%;
            max-width: 460px;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px 20px 26px;
            box-shadow: 0 10px 30px rgba(26, 49, 35, 0.06);
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .en-title {
            font-size: 11px;
            color: var(--sage-green);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .header-title-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        h1 {
            color: var(--forest-deep);
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 2px;
        }

        .branch-icon {
            width: 26px;
            height: 14px;
            fill: var(--gold-accent);
            opacity: 0.85;
        }
        .branch-right { transform: scaleX(-1); }

        .subtitle {
            font-size: 13px;
            color: var(--gold-accent);
            letter-spacing: 3px;
            font-weight: 500;
        }

        .leaf-divider {
            margin: 14px auto 22px;
            color: var(--sage-green);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            opacity: 0.55;
            font-size: 13px;
        }

        .leaf-divider::before, .leaf-divider::after {
            content: "";
            width: 40px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-accent), transparent);
        }

        .search-wrapper {
            position: relative;
            margin-bottom: 16px;
        }

        .search-input {
            width: 100%;
            padding: 14px 18px;
            font-size: 16px;
            border: 1.5px solid var(--sage-green);
            border-radius: 30px;
            outline: none;
            background: #FFFFFF;
            color: var(--text-main);
            text-align: center;
            letter-spacing: 1.5px;
            box-shadow: 0 4px 14px rgba(39, 71, 52, 0.05);
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: var(--gold-accent);
            box-shadow: 0 4px 16px rgba(184, 151, 88, 0.25);
        }

        .search-btn {
            margin-top: 12px;
            width: 100%;
            padding: 13px 20px;
            background: linear-gradient(135deg, var(--forest-dark), var(--forest-deep));
            color: #FFFFFF;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 3px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(26, 49, 35, 0.2);
            transition: all 0.25s ease;
        }

        .search-btn:active {
            transform: scale(0.98);
        }

        .result-container {
            display: none;
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px dashed var(--border-color);
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .guest-greeting {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .guest-name-tag {
            color: var(--forest-deep);
            font-weight: 600;
            font-size: 16px;
        }

        .seat-highlight-box {
            background: linear-gradient(180deg, #FFFFFF, #F7FAF8);
            border: 1.5px solid var(--gold-accent);
            border-radius: 16px;
            padding: 20px 16px;
            margin-bottom: 16px;
            box-shadow: 0 6px 18px rgba(184, 151, 88, 0.12);
        }

        .seat-badge {
            font-size: 12px;
            letter-spacing: 2px;
            color: var(--gold-accent);
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .table-display {
            font-size: 32px;
            font-weight: 700;
            color: var(--forest-deep);
            letter-spacing: 2px;
        }

        /* 宴会厅平面图容器 (匹配现场布局) */
        .floor-plan-card {
            background: #FDFCF9;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px 10px 18px;
            margin-top: 16px;
            position: relative;
        }

        .plan-title {
            font-size: 12px;
            color: var(--forest-dark);
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .stage-box {
            background: #EDE6DC;
            border: 1px solid #D6C7B2;
            color: #7D6B56;
            font-size: 12px;
            padding: 6px 0;
            border-radius: 6px;
            width: 70%;
            margin: 0 auto 12px;
            letter-spacing: 4px;
            font-weight: 500;
        }

        .plan-body {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            position: relative;
        }

        .col-left, .col-right {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 38%;
        }

        .table-row-pair {
            display: flex;
            justify-content: space-between;
            gap: 6px;
        }

        .seat-circle {
            flex: 1;
            aspect-ratio: 1;
            border-radius: 50%;
            border: 1.5px solid #CCD8D0;
            background: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #4A564F;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        /* 选中的桌位呼吸闪烁 */
        .seat-circle.target-active {
            background: var(--gold-accent) !important;
            color: #FFFFFF !important;
            border-color: #967438 !important;
            font-weight: 700 !important;
            transform: scale(1.18);
            box-shadow: 0 0 14px rgba(184, 151, 88, 0.7);
            animation: pulseGlow 1.4s infinite alternate;
            z-index: 5;
        }

        @keyframes pulseGlow {
            from { box-shadow: 0 0 6px rgba(184, 151, 88, 0.4); }
            to { box-shadow: 0 0 16px rgba(184, 151, 88, 0.9); }
        }

        /* 中间通道 (T台) */
        .center-aisle {
            width: 22%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #B5A898;
            font-size: 11px;
            letter-spacing: 2px;
            border-left: 1px dashed #E2DACF;
            border-right: 1px dashed #E2DACF;
            background: repeating-linear-gradient(45deg, transparent, transparent 6px, rgba(226, 218, 207, 0.25) 6px, rgba(226, 218, 207, 0.25) 12px);
            margin: 0 4px;
            border-radius: 8px;
        }

        .aisle-text {
            writing-mode: vertical-lr;
            letter-spacing: 4px;
        }

        .entrance-bar {
            margin-top: 14px;
            font-size: 11px;
            color: #8C9990;
            letter-spacing: 2px;
        }

        /* 查看手绘大图按钮 */
        .view-photo-btn {
            display: inline-block;
            margin-top: 14px;
            font-size: 12px;
            color: var(--forest-dark);
            text-decoration: underline;
            cursor: pointer;
            opacity: 0.85;
        }

        .not-found-box {
            display: none;
            margin-top: 20px;
            padding: 16px;
            background: #FDF7F5;
            border: 1px solid #EAD4CC;
            border-radius: 12px;
            font-size: 13px;
            color: #9E5241;
            line-height: 1.6;
            animation: fadeIn 0.3s ease forwards;
        }

        /* 图片弹窗 */
        .modal {
            display: none;
            position: fixed;
            z-index: 999;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal img {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 8px;
        }

        .footer-note {
            text-align: center;
            font-size: 11px;
            color: var(--sage-green);
            margin-top: 22px;
            line-height: 1.8;
            opacity: 0.85;
            position: relative;
            z-index: 1;
        }
    </style>
</head>

        function querySeat() {
            const inputVal = document.getElementById('guestInput').value.trim();
            const resultBox = document.getElementById('resultBox');
            const notFoundBox = document.getElementById('notFoundBox');

            if (!inputVal) {
                alert("请输入您的姓名");
                return;
            }

            // 清理上一轮选中的高亮
            document.querySelectorAll('.seat-circle').forEach(el => el.classList.remove('target-active'));

            let found = null;

            for (let t of seatingData) {
                for (let g of t.guests) {
                    if (g.toLowerCase() === inputVal.toLowerCase() || (inputVal.length >= 2 && g.includes(inputVal))) {
                        found = {
                            matchedName: g,
                            table: t.table
                        };
                        break;
                    }
                }
                if (found) break;
            }

            if (found) {
                document.getElementById('resGuestName').textContent = found.matchedName;
                document.getElementById('resTableNum').textContent = found.table;
                
                // 平面图上对应的圆圈高亮闪烁
                const targetSeatEl = document.getElementById('seat-' + found.table);
                if (targetSeatEl) {
                    targetSeatEl.classList.add('target-active');
                }

                resultBox.style.display = 'block';
                notFoundBox.style.display = 'none';

                // 自动平滑滚动到结果卡片
                setTimeout(() => {
                    resultBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }, 100);
            } else {
                resultBox.style.display = 'none';
                notFoundBox.style.display = 'block';
            }
        }

        document.getElementById('guestInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') querySeat();
        });

        function openModal() { document.getElementById('imgModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('imgModal').style.display = 'none'; }
    </script>
</body>
</html>
