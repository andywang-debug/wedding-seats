<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎参加我们的答谢宴 | 宴会座席指引</title>
    <style>
        :root {
            --forest-deep: #1C3325;
            --forest-dark: #264432;
            --sage-green: #526E5B;
            --sage-light: #EBF1ED;
            --sage-mist: #F4F7F4;
            --gold-accent: #B89758;
            --gold-light: #DFCA9B;
            --bg-cream: #FAF9F5;
            --text-main: #26302B;
            --border-color: #D5DFD8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-cream);
            background-image: 
                radial-gradient(circle at 10% 15%, rgba(82, 110, 91, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 85%, rgba(184, 151, 88, 0.05) 0%, transparent 40%);
            color: var(--text-main);
            padding: 24px 14px 70px;
            max-width: 920px;
            margin: 0 auto;
            position: relative;
            min-height: 100vh;
        }

        /* 森林角落植物点缀 (SVG) */
        .corner-leaf {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            opacity: 0.18;
            width: 110px;
            height: 110px;
        }
        .corner-leaf-top-left { top: -10px; left: -10px; }
        .corner-leaf-top-right { top: -10px; right: -10px; transform: scaleX(-1); }
        .corner-leaf-bottom-left { bottom: -10px; left: -10px; transform: scaleY(-1); }
        .corner-leaf-bottom-right { bottom: -10px; right: -10px; transform: scale(-1, -1); }

        /* 顶部标题区 */
        .header {
            text-align: center;
            margin-bottom: 22px;
            position: relative;
            z-index: 1;
        }

        .header .en-title {
            font-size: 13px;
            color: var(--sage-green);
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .header-title-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 4px 0 6px;
        }

        .header h1 {
            color: var(--forest-deep);
            font-size: 25px;
            font-weight: 600;
            letter-spacing: 2.5px;
        }

        .branch-icon {
            width: 32px;
            height: 16px;
            fill: var(--gold-accent);
            opacity: 0.85;
        }

        .branch-right {
            transform: scaleX(-1);
        }

        .header .subtitle {
            font-size: 13px;
            color: var(--gold-accent);
            letter-spacing: 4px;
            font-weight: 500;
        }

        .header .leaf-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 12px auto 6px;
            color: var(--sage-green);
            opacity: 0.6;
        }

        .leaf-divider::before, .leaf-divider::after {
            content: "";
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-accent), transparent);
        }

        /* 搜索框区 */
        .search-box {
            position: sticky;
            top: 10px;
            z-index: 100;
            margin-bottom: 22px;
            background: rgba(250, 249, 245, 0.94);
            backdrop-filter: blur(10px);
            padding: 8px 4px;
            border-radius: 16px;
        }

        .search-input {
            width: 100%;
            padding: 14px 20px;
            font-size: 15px;
            border: 1.5px solid var(--sage-green);
            border-radius: 30px;
            outline: none;
            background: #FFFFFF;
            color: var(--text-main);
            box-shadow: 0 4px 18px rgba(38, 68, 50, 0.07);
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: var(--gold-accent);
            box-shadow: 0 4px 18px rgba(184, 151, 88, 0.25);
        }

        /* 仪式舞台与动线指引 */
        .stage-banner {
            background: linear-gradient(135deg, var(--forest-deep), var(--forest-dark) 60%, var(--sage-green));
            color: #FFFFFF;
            text-align: center;
            padding: 13px;
            border-radius: 10px;
            font-size: 14px;
            letter-spacing: 4px;
            font-weight: 500;
            margin-bottom: 12px;
            box-shadow: 0 3px 10px rgba(28, 51, 37, 0.16);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .aisle-label {
            text-align: center;
            font-size: 12px;
            color: var(--sage-green);
            margin-bottom: 16px;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* 宴会桌网格 */
        .seating-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            position: relative;
            z-index: 1;
        }

        @media (min-width: 650px) {
            .seating-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 16px;
            }
        }

        /* 桌位卡片 */
        .table-card {
            background: #FFFFFF;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px 10px 14px;
            text-align: center;
            transition: all 0.28s ease;
            box-shadow: 0 2px 8px rgba(38, 68, 50, 0.03);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        /* 卡片顶部的叶片装饰条 */
        .table-card::before {
            content: "🌿";
            position: absolute;
            top: 4px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            opacity: 0.35;
        }

        .table-card.main-table {
            border-color: var(--gold-accent);
            background: #FCFAF5;
        }

        .table-card.main-table::before {
            content: "⚜️";
            opacity: 0.6;
            font-size: 9px;
            color: var(--gold-accent);
        }

        .table-card.highlight {
            border-color: var(--gold-accent);
            background: #FFFBF0;
            transform: scale(1.03);
            box-shadow: 0 6px 20px rgba(184, 151, 88, 0.32);
        }

        .table-card.dimmed {
            opacity: 0.22;
        }

        .table-number {
            font-size: 17px;
            font-weight: 600;
            color: var(--forest-deep);
            margin-top: 4px;
            margin-bottom: 3px;
        }

        .table-name {
            font-size: 12px;
            color: var(--gold-accent);
            font-weight: 500;
            margin-bottom: 10px;
        }

        /* 10人宾客名单列表 */
        .guest-list {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 4px 2px;
            font-size: 12px;
            color: #4A564F;
            border-top: 1px dashed var(--border-color);
            padding-top: 9px;
        }

        .guest-item {
            padding: 3px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .guest-item.matched {
            background-color: var(--gold-accent);
            color: #FFFFFF;
            font-weight: 600;
        }

        /* 底部森系寄语 */
        .footer-note {
            text-align: center;
            font-size: 12px;
            color: var(--sage-green);
            margin-top: 36px;
            line-height: 1.9;
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>

    <!-- 四角森林藤蔓叶片装饰 (纯SVG) -->
    <svg class="corner-leaf corner-leaf-top-left" viewBox="0 0 100 100">
        <path d="M0,0 Q30,60 100,70 Q40,30 0,0 M15,15 Q45,25 60,10 M25,35 Q60,55 75,30 M10,40 Q30,70 10,95" fill="none" stroke="#264432" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M45,20 Q60,15 65,5 Q55,15 45,20 M55,42 Q75,50 82,38 Q68,46 55,42 M22,65 Q32,80 18,90 Q22,76 22,65" fill="#526E5B"/>
    </svg>
    <svg class="corner-leaf corner-leaf-top-right" viewBox="0 0 100 100">
        <path d="M0,0 Q30,60 100,70 Q40,30 0,0 M15,15 Q45,25 60,10 M25,35 Q60,55 75,30 M10,40 Q30,70 10,95" fill="none" stroke="#264432" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M45,20 Q60,15 65,5 Q55,15 45,20 M55,42 Q75,50 82,38 Q68,46 55,42 M22,65 Q32,80 18,90 Q22,76 22,65" fill="#526E5B"/>
    </svg>
    <svg class="corner-leaf corner-leaf-bottom-left" viewBox="0 0 100 100">
        <path d="M0,0 Q30,60 100,70 Q40,30 0,0 M15,15 Q45,25 60,10 M25,35 Q60,55 75,30 M10,40 Q30,70 10,95" fill="none" stroke="#264432" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M45,20 Q60,15 65,5 Q55,15 45,20 M55,42 Q75,50 82,38 Q68,46 55,42 M22,65 Q32,80 18,90 Q22,76 22,65" fill="#526E5B"/>
    </svg>
    <svg class="corner-leaf corner-leaf-bottom-right" viewBox="0 0 100 100">
        <path d="M0,0 Q30,60 100,70 Q40,30 0,0 M15,15 Q45,25 60,10 M25,35 Q60,55 75,30 M10,40 Q30,70 10,95" fill="none" stroke="#264432" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M45,20 Q60,15 65,5 Q55,15 45,20 M55,42 Q75,50 82,38 Q68,46 55,42 M22,65 Q32,80 18,90 Q22,76 22,65" fill="#526E5B"/>
    </svg>

    <!-- 顶部标题（中英文更新） -->
    <div class="header">
        <div class="en-title">WELCOME TO OUR POST- WEDDING CELEBRATION</div>
        <div class="header-title-box">
            <!-- 橄榄枝装饰 SVG -->
            <svg class="branch-icon" viewBox="0 0 36 18">
                <path d="M0 12 C10 12 20 6 36 2 C28 6 18 14 0 12 Z"/>
                <circle cx="8" cy="8" r="2.5"/>
                <circle cx="18" cy="5" r="2.2"/>
                <circle cx="28" cy="3" r="1.8"/>
            </svg>
            <h1>欢迎参加我们的答谢宴</h1>
            <svg class="branch-icon branch-right" viewBox="0 0 36 18">
                <path d="M0 12 C10 12 20 6 36 2 C28 6 18 14 0 12 Z"/>
                <circle cx="8" cy="8" r="2.5"/>
                <circle cx="18" cy="5" r="2.2"/>
                <circle cx="28" cy="3" r="1.8"/>
            </svg>
        </div>
        <div class="subtitle">宴会座席指引</div>
        <div class="leaf-divider">🌿</div>
    </div>

    <!-- 即时查找搜索栏 -->
    <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 输入您的姓名快速查找桌号 (例: 张伟)..." oninput="handleSearch()">
    </div>

    <!-- 舞台区域与主通道导向 -->
    <div class="stage-banner">
        <span>🌿</span> 舞台 & 仪式区 <span>🌿</span>
    </div>
    <div class="aisle-label">
        <span>↓</span> T台主通道（左侧：主家席位 / 右侧：来宾席位） <span>↓</span>
    </div>

    <!-- 20桌网格卡片区（每桌10人） -->
    <div class="seating-grid" id="tablesContainer"></div>

    <!-- 底部温馨指引 -->
    <div class="footer-note">
        🌱 感谢各位亲友一路以来的陪伴与见证<br>
        如需任何协助，请随时联系现场迎宾人员
    </div>

    <script>
        // 20桌数据配置（每桌10人，随时替换名字即可）
        const tablesData = [
            { id: 1, name: "主桌 (左侧)", guests: ["新郎父母", "新郎祖父母", "至亲叔舅", "至亲姑姨", "至亲长辈A", "至亲长辈B", "至亲长辈C", "至亲长辈D", "伴郎代表", "主宾代表A"] },
            { id: 2, name: "主桌 (右侧)", guests: ["新娘父母", "新娘祖父母", "至亲舅舅", "至亲阿姨", "至亲长辈E", "至亲长辈F", "至亲长辈G", "至亲长辈H", "伴娘代表", "主宾代表B"] },
            { id: 3, name: "长辈亲友桌 01", guests: ["王大爷", "李大妈", "王伯伯", "张婶婶", "赵叔叔", "孙阿姨", "周伯父", "吴伯母", "郑爷爷", "钱奶奶"] },
            { id: 4, name: "长辈亲友桌 02", guests: ["陈大伯", "林阿姨", "黄舅舅", "刘舅妈", "何叔叔", "许姑姑", "韩伯伯", "邓阿姨", "冯爷爷", "宋奶奶"] },
            { id: 5, name: "至亲堂表桌 01", guests: ["堂哥A", "堂嫂A", "堂弟A", "堂妹A", "表哥A", "表嫂A", "表弟A", "表妹A", "侄子A", "侄女A"] },
            { id: 6, name: "至亲堂表桌 02", guests: ["表哥B", "表嫂B", "表姐B", "表妹B", "堂弟B", "堂妹B", "舅表兄", "舅表妹", "外甥A", "外甥女A"] },
            { id: 7, name: "亲友来宾桌 01", guests: ["张建国", "李秀英", "王志强", "刘海燕", "陈勇", "杨丽", "赵明", "孙敏", "周涛", "吴静"] },
            { id: 8, name: "亲友来宾桌 02", guests: ["黄国强", "徐红", "朱文", "胡秀兰", "高飞", "林芳", "马伟", "何玉英", "罗斌", "郭萍"] },
            { id: 9, name: "发小死党桌", guests: ["李雷", "韩梅梅", "刘星", "夏雨", "林冲", "武松", "鲁智深", "杨志", "花荣", "柴进"] },
            { id: 10, name: "闺蜜挚友桌", guests: ["沈佳宜", "胡一菲", "陈美嘉", "唐悠悠", "林宛瑜", "顾里", "林萧", "南湘", "唐宛如", "甄嬛"] },
            { id: 11, name: "大学同窗桌 01", guests: ["张伟", "李强", "王磊", "刘洋", "陈杰", "杨洋", "赵杰", "孙强", "周杰", "吴磊"] },
            { id: 12, name: "大学同窗桌 02", guests: ["王芳", "李娜", "张敏", "刘艳", "陈晨", "杨静", "赵婷", "孙莉", "周丽", "吴英"] },
            { id: 13, name: "校友青年桌 01", guests: ["Alex", "Bob", "Charlie", "David", "Eric", "Frank", "George", "Henry", "Ian", "Jack"] },
            { id: 14, name: "校友青年桌 02", guests: ["Alice", "Bella", "Chloe", "Daisy", "Emily", "Fiona", "Grace", "Helen", "Ivy", "Judy"] },
            { id: 15, name: "同侪伙伴桌 01", guests: ["同事A", "同事B", "同事C", "同事D", "同事E", "同事F", "同事G", "同事H", "同事I", "同事J"] },
            { id: 16, name: "同侪伙伴桌 02", guests: ["同事K", "同事L", "同事M", "同事N", "同事O", "同事P", "同事Q", "同事R", "同事S", "同事T"] },
            { id: 17, name: "挚友嘉宾桌 01", guests: ["好友A", "好友B", "好友C", "好友D", "好友E", "好友F", "好友G", "好友H", "好友I", "好友J"] },
            { id: 18, name: "挚友嘉宾桌 02", guests: ["好友K", "好友L", "好友M", "好友N", "好友O", "好友P", "好友Q", "好友R", "好友S", "好友T"] },
            { id: 19, name: "预留机动桌", guests: ["机动贵宾1", "机动贵宾2", "机动贵宾3", "机动贵宾4", "机动贵宾5", "机动贵宾6", "机动贵宾7", "机动贵宾8", "机动贵宾9", "机动贵宾10"] },
            { id: 20, name: "执行服务团队", guests: ["主摄影师", "副摄影师", "摄像师A", "摄像师B", "跟妆师", "司仪", "现场督导", "音响师", "灯光师", "宴会统筹"] }
        ];

        // 渲染20张餐桌
        function renderTables() {
            const container = document.getElementById('tablesContainer');
            container.innerHTML = '';

            tablesData.forEach(t => {
                const card = document.createElement('div');
                card.className = `table-card ${t.id <= 2 ? 'main-table' : ''}`;
                card.id = `table-${t.id}`;
                
                let guestHtml = t.guests.map(g => `<li class="guest-item" data-name="${g}">${g}</li>`).join('');

                card.innerHTML = `
                    <div class="table-number">${t.id < 10 ? '0' + t.id : t.id} 桌</div>
                    <div class="table-name">${t.name}</div>
                    <ul class="guest-list">
                        ${guestHtml}
                    </ul>
                `;
                container.appendChild(card);
            });
        }

        // 模糊实时搜索与自动定位
        function handleSearch() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            const cards = document.querySelectorAll('.table-card');
            const guestItems = document.querySelectorAll('.guest-item');

            guestItems.forEach(item => item.classList.remove('matched'));
            cards.forEach(card => card.classList.remove('highlight', 'dimmed'));

            if (!keyword) return;

            let firstMatchCard = null;

            cards.forEach(card => {
                const itemsInCard = card.querySelectorAll('.guest-item');
                let hasMatchInCard = false;

                itemsInCard.forEach(item => {
                    const guestName = item.getAttribute('data-name').toLowerCase();
                    if (guestName.includes(keyword)) {
                        item.classList.add('matched');
                        hasMatchInCard = true;
                    }
                });

                if (hasMatchInCard) {
                    card.classList.add('highlight');
                    if (!firstMatchCard) firstMatchCard = card;
                } else {
                    card.classList.add('dimmed');
                }
            });

            if (firstMatchCard) {
                firstMatchCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        renderTables();
    </script>
</body>
</html>
